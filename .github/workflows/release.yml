# This workflow requires Trusted Publisher to be configured on npmjs.com
# for the bastion-scan package. See: https://docs.npmjs.com/trusted-publishers
#
# Setup steps:
#   1. Go to npmjs.com > bastion-scan > Settings > Trusted Publishers
#   2. Add GitHub Actions publisher:
#      - Repository: absastreon/bastion
#      - Workflow: release.yml
#      - Environment: (leave blank unless using GitHub Environments)

name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish with provenance
        run: npm publish --provenance --access public --workspace=packages/cli
